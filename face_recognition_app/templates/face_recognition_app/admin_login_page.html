{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a5f;    /* Deep Ocean Blue */
            --secondary-color: #2d4a7c;   /* Royal Blue */
            --accent-color: #64ffda;      /* Mint */
            --text-light: #e3f2fd;
            --dark-bg: #0a192f;          /* Navy Dark */
            --card-bg: #172a45;          /* Card Blue */
            --border-color: rgba(100, 255, 218, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system;
            background: linear-gradient(135deg, var(--dark-bg), #162744);
            background-attachment: fixed;
            color: var(--text-light);
        }

        .container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(23, 42, 69, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 30px;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            color: var(--text-light);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: #333;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .button {
            width: 100%;
            background-color: var(--accent-color);
            color: var(--dark-bg);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.2);
        }

        .error {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            color: var(--accent-color);
            text-decoration: none;
            margin-top: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Admin Login</h2>
        </div>

        <form id="loginForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <div class="form-group">
                <button type="submit" class="button">Login</button>
            </div>

            <div id="errorMessage" class="error"></div>
        </form>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        // Simple validation for the login form
        function validateForm() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Replace with real authentication logic (e.g., API request to verify credentials)
            if (username === 'admin' && password === 'admin123') {
                // Redirect to the dashboard
                window.location.href = 'admin_dashboard.html';
                return false; // Prevent the form from submitting
            } else {
                // Display error message
                errorMessage.textContent = 'Invalid username or password. Please try again.';
                return false;
            }
        }
    </script>
</body>
</html>
