<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal – Smart Attendance System</title>
    <style>
        :root {
            --primary-color: #1e3a5f;
            --secondary-color: #2d4a7c;
            --accent-color: #64ffda;
            --text-light: #e3f2fd;
            --dark-bg: #0a192f;
            --card-bg: #172a45;
            --border-color: rgba(100, 255, 218, 0.1);
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system;
            background: linear-gradient(135deg, var(--dark-bg), #162744);
            background-attachment: fixed;
            color: var(--text-light);
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(23, 42, 69, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }
        h2 {
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--dark-bg);
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 10px 5px 10px 0;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.2);
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- back to your main dashboard view -->
        <a href="{% url 'home' %}" class="back-link">← Back to Dashboard</a>
        <h2>Admin Control Panel</h2>

        <!-- 1. Manage Students -->
        <div class="section">
            <h3>Manage Students</h3>
            <a href="{% url 'view_students' %}" class="button">View All Students</a>
        </div>

        <!-- 2. Attendance Controls -->
        <div class="section">
            <h3>Attendance Controls</h3>
            <a href="{% url 'sync_attendance' %}" class="button">Sync Attendance Data</a>
            <a href="{% url 'generate_daily_report' %}" class="button">Generate Daily Report</a>
        </div>

        <!-- 3. System Logs -->
        <div class="section">
            <h3>System Logs</h3>
            <p>Feature Coming Soon: Display logs of system activities.</p>
        </div>
    </div>
</body>
</html>
