{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a5f;
            --secondary-color: #2d4a7c;
            --accent-color: #64ffda;
            --text-light: #e3f2fd;
            --dark-bg: #0a192f;
            --card-bg: #172a45;
            --border-color: rgba(100, 255, 218, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system;
            background: linear-gradient(135deg, var(--dark-bg), #162744);
            background-attachment: fixed;
            color: var(--text-light);
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(23, 42, 69, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h2 {
            font-size: 36px;
            color: var(--accent-color);
        }

        .card {
            background: var(--card-bg);
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .card table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        .card table th, .card table td {
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .card table th {
            background-color: var(--primary-color);
            color: var(--text-light);
        }

        .card table tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .button {
            background-color: var(--accent-color);
            color: var(--dark-bg);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.2);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-light);
        }

        .action-btns {
            display: flex;
            justify-content: center;
        }

        .action-btns button {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Dashboard</a>
        <div class="header">
            <h2>Admin Dashboard - Smart Attendance System</h2>
        </div>

        <div class="card">
            <h3>Student Registrations</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentList">
                    <!-- Dynamic student list will go here -->
                </tbody>
            </table>
        </div>

        <div class="action-btns">
            <button class="button" onclick="loadStudentRegistrations()">Load Registrations</button>
            <button class="button" onclick="clearAllRegistrations()">Clear All</button>
        </div>
    </div>

    <script>
        // Mock Data for the list of students
        const students = [
            { id: 1, name: 'John Doe', email: 'johndoe@example.com' },
            { id: 2, name: 'Jane Smith', email: 'janesmith@example.com' },
            { id: 3, name: 'Sam Wilson', email: 'samwilson@example.com' }
        ];

        // Function to load student registrations into the table
        function loadStudentRegistrations() {
            const studentList = document.getElementById('studentList');
            studentList.innerHTML = ''; // Clear current list

            if (students.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="4">No registrations found.</td>`;
                studentList.appendChild(row);
                return;
            }

            students.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>
                        <button class="button" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                `;
                studentList.appendChild(row);
            });
        }

        // Function to delete a student registration
        function deleteStudent(studentId) {
            const student = students.find(s => s.id === studentId);
            if (student) {
                const index = students.indexOf(student);
                if (index > -1) {
                    students.splice(index, 1);
                    loadStudentRegistrations(); // Reload the list after deletion
                    alert('Employee deleted successfully');
                }
            }
        }

        // Function to clear all student registrations
        function clearAllRegistrations() {
            if (confirm('Are you sure you want to clear all registrations?')) {
                students.length = 0;
                loadStudentRegistrations();
                alert('All employee registrations have been cleared');
            }
        }

        // Initial load
        loadStudentRegistrations();
    </script>
</body>
</html>
