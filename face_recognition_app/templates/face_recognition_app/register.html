<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" >
    <style>
        :root {
            --primary-color: #1e3a5f;
            --accent-color: #64ffda;
            --dark-bg: #0a192f;
            --card-bg: #172a45;
            --text-light: #e3f2fd;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg), #162744);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui;
        }

        .registration-card {
            background: rgba(23, 42, 69, 0.8);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        #faceGuide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 350px;
            border: 3px solid var(--accent-color);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>New Employee Registration</h2>
            <a href="/" class="btn btn-outline-light">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
        </div>

        <div class="registration-card">
            <form id="registrationForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Employee ID</label>
                        <input type="text" name="employee_id" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Department</option>
                            <option value="IT">Information Technology</option>
                            <option value="HR">Human Resources</option>
                            <option value="Finance">Finance</option>
                            <option value="Operations">Operations</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Position</label>
                        <input type="text" name="position" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Face Capture</label>
                    <div class="video-container position-relative">
                        <video id="video" width="100%" autoplay playsinline></video>
                        <div id="faceGuide"></div>
                        <canvas id="canvas" style="display:none;"></canvas>
                    </div>
                    <button type="button" id="captureBtn" class="btn btn-primary mt-2">
                        <i class="bi bi-camera"></i> Capture Photo
                    </button>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="bi bi-person-check"></i> Submit Registration
                    </button>
                </div>
            </form>

            <div id="approvalNotice" class="alert alert-info mt-3" style="display:none;">
                Your registration has been submitted for admin approval.
            </div>
        </div>
    </div>

    <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const response = await fetch('/register_employee/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrftoken
            },
            body: formData
        });

        const result = await response.json();
        if (result.success) {
            document.getElementById('approvalNotice').style.display = 'block';
            e.target.reset();
        } else {
            alert('Error: ' + (result.error || 'Unknown error occurred.'));
        }
    });
</script>
<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');

    // Start video stream from webcam
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Camera access denied: ", err);
            alert("Unable to access the camera. Please allow camera permissions.");
        });

    // Capture the current video frame to canvas
    captureBtn.addEventListener('click', () => {
        canvas.style.display = 'block';
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
    });

    // Intercept form submission to include captured image
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        // Convert canvas image to Blob and append to form
        canvas.toBlob((blob) => {
            formData.append('captured_image', blob, 'face.png');

            fetch('/register_employee/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    document.getElementById('approvalNotice').style.display = 'block';
                    e.target.reset();
                    canvas.style.display = 'none';
                } else {
                    alert('Error: ' + (result.error || 'Unknown error occurred.'));
                }
            })
            .catch(error => {
                console.error('Submission failed:', error);
                alert('Failed to submit form.');
            });
        }, 'image/png');
    });
</script>

</body>
</html>
